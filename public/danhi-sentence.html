<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>단희 문장 외우기</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--red:#ef5a5f;--green:#36b37e;--yellow:#ffc93c;--blue:#4c9be8;--purple:#9b6ef3;--orange:#f39c3d;--ink:#3a2d28;--soft:#f3f8ff;--line:#dbe6f3}
html,body{height:100%;overscroll-behavior:none}
body{font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--soft);color:var(--ink);user-select:none;-webkit-user-select:none;overflow-x:hidden}
.en{font-family:'Nunito','Helvetica Neue',Arial,sans-serif;font-weight:800}
.screen{display:none;min-height:100%;padding:20px 16px 40px;max-width:760px;margin:0 auto}
.screen.on{display:block}
button{font-family:inherit;border:none;cursor:pointer;color:inherit}
.btn{border-radius:18px;padding:16px 18px;font-size:22px;box-shadow:0 5px 0 rgba(0,0,0,.14)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.14)}
.btn.main{background:var(--red);color:#fff}
.btn.sub{background:#e4edf8;color:#4d5d72}
.btn:disabled{opacity:.45}
h1{font-size:36px;text-align:center;margin:6px 0 4px}
.tagline{text-align:center;color:#7d8ea3;font-size:18px;margin-bottom:22px}
.sec{background:#fff;border-radius:22px;padding:18px;margin-bottom:16px;box-shadow:0 5px 0 var(--line)}
.sec h2{font-size:21px;margin-bottom:12px}
.row{display:flex;gap:10px}.row>*{flex:1}
.toggle{background:#f1f6fc;border:3px solid transparent;border-radius:16px;padding:14px;font-size:20px}
.toggle.sel{background:#eef5ff;border-color:var(--blue)}
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.mode{border-radius:20px;padding:18px 14px;color:#fff;text-align:left;box-shadow:0 6px 0 rgba(0,0,0,.15)}
.mode:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.mode .ic{font-size:34px}.mode .t{font-size:23px;margin:4px 0 2px}.mode .d{font-size:15px;opacity:.92}
.m1{background:var(--blue)}.m2{background:var(--orange)}.m3{background:var(--green)}.m4{background:var(--purple)}

.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.home{background:#fff;border-radius:14px;width:52px;height:52px;font-size:26px;box-shadow:0 4px 0 var(--line);flex:none}
.bar{flex:1;height:16px;background:#dfe9f5;border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--yellow);width:0;transition:width .35s}
.stat{font-size:20px;white-space:nowrap}
.combo{font-size:18px;color:var(--red);height:24px;text-align:right;margin-bottom:6px}
.card{background:#fff;border-radius:26px;padding:22px 18px;box-shadow:0 7px 0 var(--line);text-align:center}
.num{display:inline-block;background:#eef5ff;color:#6c8bb0;border-radius:20px;padding:4px 14px;font-size:15px;margin-bottom:12px}
.ko{font-size:30px;line-height:1.35;margin-bottom:12px}
.sent{font-size:34px;line-height:1.35;margin:8px 0 12px;word-break:keep-all}
.sent .w{display:inline-block;padding:2px 6px;margin:2px;border-radius:10px;transition:background .15s}
.sent .w.lit{background:#fff1bf}
.sbtns{display:flex;gap:12px;justify-content:center;margin:6px 0}
.say{background:var(--yellow);border-radius:40px;height:64px;padding:0 22px;font-size:24px;box-shadow:0 5px 0 #e2a91e}
.say.slow{background:#c9e4ff;box-shadow:0 5px 0 #8fbfeb}
.say:active{transform:translateY(4px);box-shadow:none}
.nav{display:flex;gap:12px;margin-top:18px}.nav .btn{flex:1}
.cover{background:#eef5ff;border-radius:16px;padding:16px;font-size:20px;color:#6c8bb0;margin:8px 0}

.answer{min-height:70px;background:#f7faff;border:3px dashed #c6d7ec;border-radius:18px;padding:10px;margin:14px 0 6px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.answer.ok{border-color:var(--green);background:#e9f9f1;border-style:solid}
.answer.no{border-color:var(--red);background:#ffeeee;border-style:solid}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}
.chip{background:var(--orange);color:#fff;border-radius:14px;padding:12px 16px;font-size:26px;box-shadow:0 5px 0 #cf7c22}
.chip:active{transform:translateY(4px);box-shadow:none}
.chip.in{background:#fff;color:var(--ink);border:3px solid #f3b37a;box-shadow:none;padding:9px 13px}
.chip.used{visibility:hidden}
.blank{display:inline-block;min-width:110px;border-bottom:4px solid var(--green);color:var(--green);margin:0 4px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.opt{background:#fff;border:3px solid var(--line);border-radius:18px;padding:18px 10px;font-size:26px;box-shadow:0 5px 0 var(--line)}
.opt.ok{background:#e6f8ef;border-color:var(--green);color:#1d7a52}
.opt.no{background:#ffecec;border-color:var(--red);color:#c43a3f}
textarea.typ{width:100%;font-family:'Nunito',Arial,sans-serif;font-weight:800;font-size:26px;padding:14px;border:3px solid var(--line);border-radius:18px;outline:none;resize:none;height:110px;color:var(--ink);-webkit-user-select:text;user-select:text}
textarea.typ:focus{border-color:var(--purple)}
textarea.typ.ok{border-color:var(--green);background:#e6f8ef}
textarea.typ.no{border-color:var(--red);background:#ffecec}
.hintline{font-size:22px;color:#8a9bb0;min-height:30px;margin:6px 0}
.msg{min-height:56px;margin-top:12px;font-size:24px;line-height:1.35}
.msg .ans{font-family:'Nunito',Arial,sans-serif;font-weight:900;font-size:24px;color:var(--green)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.burst{position:fixed;pointer-events:none;font-size:34px;z-index:50;animation:fly 1s ease-out forwards}
@keyframes fly{0%{opacity:1;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1.3)}}
.big{font-size:64px;text-align:center;color:var(--red);margin:6px 0}
.stars{text-align:center;font-size:46px;letter-spacing:6px}
.rtitle{text-align:center;font-size:28px;margin-top:8px}
.wl{margin:18px 0;text-align:left}
.wl div{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:2px dashed var(--line);font-size:19px}
.wl .e{font-family:'Nunito',Arial,sans-serif;font-weight:800}
.wl small{display:block;color:#7d8ea3;font-family:'Jua',sans-serif;font-size:16px}
.wl button{background:#fff3cf;border-radius:50%;width:42px;height:42px;font-size:20px;flex:none}
.col{display:flex;flex-direction:column;gap:12px}
@media (min-width:700px){.modes{grid-template-columns:repeat(4,1fr)}.sent{font-size:40px}}
</style>
</head>
<body>
<div class="screen on" id="sHome">
  <h1>🗣️ 단희 문장 외우기</h1>
  <div class="tagline">11번 ~ 20번 · 문장 10개</div>
  <div class="sec">
    <h2>① 문제 순서</h2>
    <div class="row">
      <button class="toggle sel" data-ord="seq">📋 순서대로</button>
      <button class="toggle" data-ord="rand">🎲 랜덤</button>
    </div>
  </div>
  <div class="sec">
    <h2>② 무엇을 할까?</h2>
    <div class="modes">
      <button class="mode m1" data-mode="learn"><div class="ic">📖</div><div class="t">문장 익히기</div><div class="d">듣고 따라 읽기</div></button>
      <button class="mode m2" data-mode="blocks"><div class="ic">🧩</div><div class="t">단어 블록</div><div class="d">쉬움 · 순서대로 놓기</div></button>
      <button class="mode m3" data-mode="blank"><div class="ic">🕳️</div><div class="t">빈칸 채우기</div><div class="d">보통 · 빠진 단어 고르기</div></button>
      <button class="mode m4" data-mode="type"><div class="ic">✏️</div><div class="t">직접 쓰기</div><div class="d">도전 · 문장 통째로 쓰기</div></button>
    </div>
  </div>
</div>

<div class="screen" id="sGame">
  <div class="top">
    <button class="home" id="homeBtn">🏠</button>
    <div class="bar"><i id="prog"></i></div>
    <div class="stat" id="count"></div>
    <div class="stat" id="scoreBox">⭐<span id="score">0</span></div>
  </div>
  <div class="combo" id="combo"></div>
  <div id="stage"></div>
</div>

<div class="screen" id="sResult">
  <div class="card">
    <div class="rtitle" id="rTitle"></div>
    <div class="stars" id="rStars"></div>
    <div class="big" id="rScore"></div>
    <div id="rWrong"></div>
    <div class="col">
      <button class="btn main" id="rRetryWrong">❗ 틀린 것만 다시</button>
      <button class="btn main" id="rAgain" style="background:var(--blue)">🔁 한 번 더</button>
      <button class="btn sub" id="rHome">🏠 처음으로</button>
    </div>
  </div>
</div>

const KEEP_CAP=['I','Bella','Somi','New','York'];

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]];}return a;}
const pick=a=>a[Math.floor(Math.random()*a.length)];
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$(id).classList.add('on');window.scrollTo(0,0);}
const PRAISE=['정답! 🎉','최고야! 👏','잘했어! 🌟','완벽해! 💯','멋져! 😎','천재다! 🧠'];
const CHEER=['괜찮아, 다시! 💪','아깝다! 한 번 더 ✏️','조금만 더! 🙂'];

// words of a sentence (without end mark), end mark
const words=s=>s.en.replace(/[.?!]$/,'').split(' ');
const endMark=s=>s.en.slice(-1);
const chipText=(w,i)=>(i===0&&!KEEP_CAP.includes(w))?w.toLowerCase():w;
function norm(t){
  t=t.toLowerCase().replace(/[’‘`]/g,"'");
  t=t.replace(/\bisn't\b/g,'is not').replace(/\bwe're\b/g,'we are').replace(/\bmustn't\b/g,'must not');
  return t.replace(/[^a-z' ]/g,' ').replace(/\s+/g,' ').trim();
}

// sound
const player=new Audio();
function speak(s,slow){try{player.pause();player.src=AUDIO['s'+s.n];player.playbackRate=slow?0.7:1;player.currentTime=0;const r=player.play();if(r&&r.catch)r.catch(()=>{});}catch(e){}}
let ctx=null;
function beep(good){try{if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();
  (good?[660,880,1175]:[260,200]).forEach((f,k)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type=good?'triangle':'sine';o.frequency.value=f;const t=ctx.currentTime+k*0.09;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.18,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.22);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+0.25);});}catch(e){}}
function burst(el){const r=el.getBoundingClientRect();for(let k=0;k<8;k++){const s=document.createElement('div');s.className='burst';s.textContent=pick(['⭐','✨','🎉','💖','🌟']);
  s.style.left=(r.left+r.width/2-17)+'px';s.style.top=(r.top+r.height/2-17)+'px';const a=Math.random()*Math.PI*2,d=90+Math.random()*80;
  s.style.setProperty('--x',Math.cos(a)*d+'px');s.style.setProperty('--y',Math.sin(a)*d+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),1000);}}
function soundBtns(){return `<div class="sbtns"><button class="say" id="say">🔊 듣기</button><button class="say slow" id="slow">🐢 천천히</button></div>`;}
function bindSound(s){$('say').onclick=()=>speak(s);$('slow').onclick=()=>speak(s,true);}

// home
let order='seq';
document.querySelectorAll('.toggle').forEach(b=>b.onclick=()=>{document.querySelectorAll('.toggle').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');order=b.dataset.ord;});
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>start(b.dataset.mode,SENTS));
$('homeBtn').onclick=()=>{player.pause();show('sHome');};

// game
let mode,base,deck,idx,score,combo,wrong,tries,locked;
function start(m,list){mode=m;base=list;deck=order==='rand'?shuffle(list):list.slice();idx=0;score=0;combo=0;wrong=[];
  $('scoreBox').style.visibility=m==='learn'?'hidden':'visible';show('sGame');render();}
function render(){tries=0;locked=false;
  $('count').textContent=`${idx+1}/${deck.length}`;$('prog').style.width=(idx/deck.length*100)+'%';$('score').textContent=score;
  $('combo').textContent=combo>=2?`🔥 ${combo} 콤보!`:'';
  ({learn:rLearn,blocks:rBlocks,blank:rBlank,type:rType})[mode](deck[idx]);}
function good(s,el){locked=true;if(tries===0)score++;else markWrong(s);combo=tries===0?combo+1:0;beep(true);burst(el);speak(s);
  $('score').textContent=score;$('combo').textContent=combo>=2?`🔥 ${combo} 콤보!`:'';}
function bad(s){tries++;markWrong(s);combo=0;$('combo').textContent='';beep(false);}
function markWrong(s){if(!wrong.includes(s))wrong.push(s);}
function next(){idx++;idx<deck.length?render():finish();}
function nextBtn(){return `<div class="nav" id="nav" style="display:none"><button class="btn main" id="nx">${idx<deck.length-1?'다음 ▶':'결과 보기 🏁'}</button></div>`;}
function showNext(){$('nav').style.display='flex';$('nx').onclick=next;}

// learn: Korean -> tap to reveal English, word highlight
function rLearn(s){
  $('stage').innerHTML=`<div class="card">
    <div class="num">${s.n}번</div>
    <div class="ko">${esc(s.ko)}</div>
    <div class="sent en" id="sent">${words(s).map((w,i)=>`<span class="w" data-i="${i}">${esc(w)}${i===words(s).length-1?esc(endMark(s)):''}</span>`).join(' ')}</div>
    ${soundBtns()}
    <div style="font-size:17px;color:#8a9bb0;margin-top:10px">듣고 소리 내서 3번 따라 읽어 봐요 🗣️</div>
  </div>
  <div class="nav">
    <button class="btn sub" id="prev" ${idx===0?'disabled':''}>◀ 이전</button>
    <button class="btn main" id="nx">${idx<deck.length-1?'다음 ▶':'다 봤어요! ✅'}</button>
  </div>`;
  bindSound(s);
  $('sent').querySelectorAll('.w').forEach(w=>w.onclick=()=>{w.classList.toggle('lit');});
  $('prev').onclick=()=>{if(idx>0){idx--;render();}};
  $('nx').onclick=()=>{if(idx<deck.length-1){idx++;render();}else learnDone();};
  speak(s);
}
function learnDone(){$('prog').style.width='100%';
  $('stage').innerHTML=`<div class="card"><div style="font-size:60px">🎉</div><div class="rtitle">문장 ${deck.length}개 다 봤어요!</div>
  <div style="font-size:19px;color:#8a9bb0;margin:10px 0 20px">이제 게임으로 외워 볼까요?</div>
  <div class="col"><button class="btn main" style="background:var(--orange)" data-go="blocks">🧩 단어 블록</button>
  <button class="btn main" style="background:var(--green)" data-go="blank">🕳️ 빈칸 채우기</button>
  <button class="btn main" style="background:var(--purple)" data-go="type">✏️ 직접 쓰기</button>
  <button class="btn sub" data-go="home">🏠 처음으로</button></div></div>`;
  $('stage').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>b.dataset.go==='home'?show('sHome'):start(b.dataset.go,base));}

// blocks
let placed,chips;
function rBlocks(s){
  const ws=words(s).map(chipText);
  chips=shuffle(ws.map((t,k)=>({t,k})));
  if(chips.map(c=>c.t).join(' ')===ws.join(' '))chips.reverse();
  placed=[];
  $('stage').innerHTML=`<div class="card">
    <div class="num">${s.n}번</div>
    <div class="ko">${esc(s.ko)}</div>
    ${soundBtns()}
    <div class="answer" id="ans"></div>
    <div class="chips" id="chips"></div>
    <div class="msg" id="msg"></div>${nextBtn()}</div>`;
  bindSound(s);drawBlocks(s);
}
function drawBlocks(s,state){
  const ws=words(s).map(chipText);
  $('ans').className='answer'+(state?' '+state:'');
  $('ans').innerHTML=placed.length?placed.map((c,p)=>`<button class="chip in en" data-p="${p}">${esc(chips[c].t)}</button>`).join('')+`<span class="en" style="font-size:26px">${esc(endMark(s))}</span>`:'<span style="color:#a9b8ca;font-size:18px">아래 블록을 순서대로 눌러요 👇</span>';
  $('chips').innerHTML=chips.map((c,k)=>`<button class="chip en ${placed.includes(k)?'used':''}" data-k="${k}">${esc(c.t)}</button>`).join('');
  $('chips').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{if(locked)return;placed.push(+b.dataset.k);drawBlocks(s);
    if(placed.length===ws.length)checkBlocks(s);});
  $('ans').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{if(locked)return;placed.splice(+b.dataset.p,1);drawBlocks(s);});
}
function checkBlocks(s){
  const got=placed.map(k=>chips[k].t).join(' '),want=words(s).map(chipText).join(' ');
  if(got===want){good(s,$('ans'));drawBlocks(s,'ok');$('chips').style.display='none';
    $('msg').innerHTML=pick(PRAISE)+`<br><span class="ans">${esc(s.en)}</span>`;showNext();}
  else{bad(s);drawBlocks(s,'no');$('ans').classList.add('shake');
    if(tries>=2){locked=true;speak(s);$('chips').style.display='none';$('msg').innerHTML=`정답은<br><span class="ans">${esc(s.en)}</span>`;showNext();}
    else{$('msg').textContent=pick(CHEER);setTimeout(()=>{placed=[];drawBlocks(s);},900);}}
}

// blank
function rBlank(s){
  const ws=words(s);
  const cand=ws.map((w,i)=>i).filter(i=>ws[i].length>=3&&!['the','you'].includes(ws[i].toLowerCase()));
  const bi=pick(cand.length?cand:ws.map((w,i)=>i));
  const answer=chipText(ws[bi],bi);
  const pool=[...new Set(SENTS.flatMap(x=>words(x).map(w=>KEEP_CAP.includes(w)?w:w.toLowerCase())))].filter(w=>w.toLowerCase()!==answer.toLowerCase()&&w.length>=2);
  const opts=shuffle([answer,...shuffle(pool).slice(0,3)]);
  const shown=ws.map((w,i)=>i===bi?'<span class="blank" id="blank">&nbsp;</span>':esc(w)).join(' ')+esc(endMark(s));
  $('stage').innerHTML=`<div class="card">
    <div class="num">${s.n}번</div>
    <div class="ko">${esc(s.ko)}</div>
    <div class="sent en">${shown}</div>
    ${soundBtns()}
    <div class="opts">${opts.map((o,k)=>`<button class="opt en" data-k="${k}">${esc(o)}</button>`).join('')}</div>
    <div class="msg" id="msg"></div>${nextBtn()}</div>`;
  bindSound(s);
  $('stage').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(locked)return;const o=opts[+b.dataset.k];
    if(o===answer){b.classList.add('ok');$('blank').textContent=ws[bi];good(s,b);$('msg').textContent=pick(PRAISE);showNext();}
    else{b.classList.add('no');b.disabled=true;bad(s);$('msg').textContent=pick(CHEER);
      if(tries>=2){locked=true;$('blank').textContent=ws[bi];speak(s);
        $('stage').querySelectorAll('.opt').forEach(x=>{if(opts[+x.dataset.k]===answer)x.classList.add('ok');});
        $('msg').textContent='정답은 초록색이에요 👀';showNext();}}
  });
}

// type
let hint;
function rType(s){
  hint=0;
  $('stage').innerHTML=`<div class="card">
    <div class="num">${s.n}번</div>
    <div class="ko">${esc(s.ko)}</div>
    ${soundBtns()}
    <div class="hintline en" id="hl"></div>
    <textarea class="typ" id="ta" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="영어 문장을 써 보세요"></textarea>
    <div class="msg" id="msg"></div>
    <div class="nav"><button class="btn sub" id="hintBtn">💡 힌트</button><button class="btn main" id="go">확인</button></div></div>`;
  bindSound(s);
  const ws=words(s);
  const drawHint=()=>{$('hl').textContent=ws.map((w,i)=>i<hint?w:'_'.repeat(Math.max(2,Math.min(w.length,6)))).join(' ')+` (${ws.length}단어)`;};
  drawHint();
  $('hintBtn').onclick=()=>{if(locked)return;if(hint<ws.length-1){hint++;drawHint();}};
  $('ta').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('go').click();}});
  $('go').onclick=()=>{
    if(locked){next();return;}
    const a=$('ta'),v=norm(a.value);if(!v)return;
    if(v===norm(s.en)){
      if(hint>0&&tries===0){tries=1;} // 힌트 쓰면 별 없이 정답 처리
      a.className='typ ok';a.disabled=true;good(s,a);
      $('msg').innerHTML=pick(PRAISE)+`<br><span class="ans">${esc(s.en)}</span>`;end();
    }else{bad(s);a.className='typ no';a.classList.add('shake');setTimeout(()=>a.classList.remove('shake'),400);
      if(tries>=2){locked=true;a.disabled=true;speak(s);$('msg').innerHTML=`정답은<br><span class="ans">${esc(s.en)}</span>`;end();}
      else $('msg').textContent=pick(CHEER)+' (힌트도 써 봐요)';}
  };
  function end(){$('hintBtn').disabled=true;$('go').textContent=idx<deck.length-1?'다음 ▶':'결과 보기 🏁';}
}

// result
function finish(){player.pause();const n=deck.length,r=score/n;
  $('rTitle').textContent=r===1?'완벽해요! 💯':r>=0.8?'아주 잘했어요! 🎉':r>=0.5?'좋아요, 조금만 더! 💪':'천천히 다시 해 봐요 🙂';
  $('rStars').textContent=r>=0.9?'⭐⭐⭐':r>=0.6?'⭐⭐☆':r>=0.3?'⭐☆☆':'☆☆☆';
  $('rScore').textContent=`${score} / ${n}`;
  if(wrong.length){
    $('rWrong').innerHTML=`<div style="font-size:20px;margin-top:10px;text-align:center">다시 볼 문장 ${wrong.length}개</div><div class="wl">`+
      wrong.map((x,k)=>`<div><button data-k="${k}">🔊</button><span class="e">${esc(x.en)}<small>${esc(x.ko)}</small></span></div>`).join('')+'</div>';
    $('rWrong').querySelectorAll('button').forEach(b=>b.onclick=()=>speak(wrong[+b.dataset.k]));
    $('rRetryWrong').style.display='';
  }else{$('rWrong').innerHTML='';$('rRetryWrong').style.display='none';}
  show('sResult');}
$('rRetryWrong').onclick=()=>start(mode,wrong.slice());
$('rAgain').onclick=()=>start(mode,base);
$('rHome').onclick=()=>show('sHome');
</script>
</body>
</html>
