<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>단희 영단어 놀이터</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--red:#ef5a5f;--green:#36b37e;--yellow:#ffc93c;--blue:#4c9be8;--purple:#9b6ef3;--ink:#3a2d28;--soft:#fff6ec;--line:#f0dccb}
html,body{height:100%;overscroll-behavior:none}
body{font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--soft);color:var(--ink);user-select:none;-webkit-user-select:none;overflow-x:hidden}
.en{font-family:'Nunito','Helvetica Neue',Arial,sans-serif;font-weight:800}
.screen{display:none;min-height:100%;padding:20px 16px 40px;max-width:760px;margin:0 auto}
.screen.on{display:block}
button{font-family:inherit;border:none;cursor:pointer;color:inherit}
.btn{border-radius:18px;padding:16px 18px;font-size:22px;box-shadow:0 5px 0 rgba(0,0,0,.14);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.14)}
.btn.main{background:var(--red);color:#fff}
.btn.sub{background:#f3e3d4;color:#6b5249}
.btn:disabled{opacity:.45}

/* home */
h1{font-size:36px;text-align:center;margin:6px 0 4px}
.tagline{text-align:center;color:#9a8679;font-size:18px;margin-bottom:22px}
.sec{background:#fff;border-radius:22px;padding:18px;margin-bottom:16px;box-shadow:0 5px 0 var(--line)}
.sec h2{font-size:21px;margin-bottom:12px}
.units{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.unit{background:#fbf3ea;border:3px solid transparent;border-radius:16px;padding:12px 12px;text-align:left;font-size:17px;line-height:1.3}
.unit b{display:block;font-size:15px;color:#b19a8b;font-weight:normal}
.unit.sel{background:#fff0ef;border-color:var(--red)}
.unit.sel b{color:var(--red)}
.row{display:flex;gap:10px}
.row>*{flex:1}
.toggle{background:#fbf3ea;border:3px solid transparent;border-radius:16px;padding:14px;font-size:20px}
.toggle.sel{background:#fff0ef;border-color:var(--red)}
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.mode{border-radius:20px;padding:18px 14px;color:#fff;text-align:left;box-shadow:0 6px 0 rgba(0,0,0,.15)}
.mode:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.mode .ic{font-size:34px}
.mode .t{font-size:23px;margin:4px 0 2px}
.mode .d{font-size:15px;opacity:.92}
.m1{background:var(--blue)}.m2{background:var(--green)}.m3{background:#f39c3d}.m4{background:var(--purple)}
.allbtn{background:none;font-size:16px;color:var(--red);float:right;margin-top:-34px;padding:6px}
.cnt{color:#9a8679;font-size:16px;margin-top:10px;text-align:right}

/* game */
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.home{background:#fff;border-radius:14px;width:52px;height:52px;font-size:26px;box-shadow:0 4px 0 var(--line);flex:none}
.bar{flex:1;height:16px;background:#f1dfcf;border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--yellow);width:0;transition:width .35s}
.stat{font-size:20px;white-space:nowrap}
.combo{font-size:18px;color:var(--red);height:24px;text-align:right;margin-bottom:6px;transition:transform .2s}
.combo.pop{transform:scale(1.3)}
.card{background:#fff;border-radius:26px;padding:24px 20px;box-shadow:0 7px 0 var(--line);text-align:center;position:relative}
.utag{display:inline-block;background:#fbf3ea;color:#a8907f;border-radius:20px;padding:4px 14px;font-size:15px;margin-bottom:12px}
.word{font-size:52px;line-height:1.15;margin:6px 0 6px;word-break:break-word;color:var(--ink)}
.read{font-size:22px;color:#a8907f;margin-bottom:12px}
.ko{font-size:34px;line-height:1.3;margin-bottom:10px}
.def{font-size:18px;color:#8c7a70;line-height:1.4;font-family:'Nunito',Arial,sans-serif;font-weight:700}
.say{background:var(--yellow);border-radius:50%;width:76px;height:76px;font-size:36px;box-shadow:0 5px 0 #e2a91e;margin:6px auto 4px;display:block}
.say:active{transform:translateY(4px);box-shadow:0 1px 0 #e2a91e}
.say.small{width:58px;height:58px;font-size:28px}
.nav{display:flex;gap:12px;margin-top:18px}
.nav .btn{flex:1}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.opt{background:#fff;border:3px solid var(--line);border-radius:18px;padding:18px 10px;font-size:22px;line-height:1.3;min-height:92px;box-shadow:0 5px 0 var(--line)}
.opt:active{transform:translateY(3px)}
.opt.ok{background:#e6f8ef;border-color:var(--green);color:#1d7a52}
.opt.no{background:#ffecec;border-color:var(--red);color:#c43a3f}

.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin:18px 0 8px;min-height:64px}
.grp{display:flex;gap:6px}
.slot{width:44px;height:56px;border-radius:12px;background:#fbf3ea;border:3px dashed #e6cdb9;font-size:30px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.slot.f{border-style:solid;border-color:#f3b37a;background:#fff4e6}
.slot.fix{background:none;border:none;width:18px}
.slots.ok .slot.f{border-color:var(--green);background:#e6f8ef}
.slots.no .slot.f{border-color:var(--red);background:#ffecec}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:14px}
.tile{width:56px;height:62px;border-radius:14px;background:#f39c3d;color:#fff;font-size:32px;box-shadow:0 5px 0 #cf7c22}
.tile:active{transform:translateY(4px);box-shadow:0 1px 0 #cf7c22}
.tile.used{visibility:hidden}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

.blanks{font-size:24px;letter-spacing:5px;color:#c4b0a2;margin:10px 0 14px;word-break:break-all}
input.typ{width:100%;font-family:'Nunito',Arial,sans-serif;font-weight:800;font-size:32px;text-align:center;padding:16px;border:3px solid var(--line);border-radius:18px;outline:none;color:var(--ink);background:#fff;-webkit-user-select:text;user-select:text}
input.typ:focus{border-color:var(--purple)}
input.typ.ok{border-color:var(--green);background:#e6f8ef}
input.typ.no{border-color:var(--red);background:#ffecec}

.msg{min-height:64px;margin-top:14px;font-size:24px;line-height:1.35}
.msg .ans{font-family:'Nunito',Arial,sans-serif;font-weight:900;font-size:30px;color:var(--green)}

.burst{position:fixed;pointer-events:none;font-size:34px;z-index:50;animation:fly 1s ease-out forwards}
@keyframes fly{0%{opacity:1;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1.3)}}

/* result */
.big{font-size:64px;text-align:center;color:var(--red);margin:6px 0}
.stars{text-align:center;font-size:46px;letter-spacing:6px}
.rtitle{text-align:center;font-size:28px;margin-top:8px}
.wl{margin:18px 0}
.wl div{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:2px dashed var(--line);font-size:19px}
.wl .w{font-family:'Nunito',Arial,sans-serif;font-weight:900;color:var(--red);font-size:21px}
.wl .k{margin-left:auto;text-align:right;color:#6b5249}
.wl button{background:#fff3cf;border-radius:50%;width:42px;height:42px;font-size:20px;flex:none}
.col{display:flex;flex-direction:column;gap:12px}

@media (min-width:700px){
  .units{grid-template-columns:repeat(4,1fr)}
  .modes{grid-template-columns:repeat(4,1fr)}
  .word{font-size:64px}
}
</style>
</head>
<body>

<!-- HOME -->
<div class="screen on" id="sHome">
  <h1>🍭 단희 영단어 놀이터</h1>
  <div class="tagline">150-word READING 1 · Unit 1~8</div>

  <div class="sec">
    <h2>① 어디를 공부할까?</h2>
    <button class="allbtn" id="allBtn">전체 선택</button>
    <div class="units" id="units"></div>
    <div class="cnt" id="cnt"></div>
  </div>

  <div class="sec">
    <h2>② 문제 순서</h2>
    <div class="row">
      <button class="toggle sel" data-ord="seq">📋 순서대로</button>
      <button class="toggle" data-ord="rand">🎲 랜덤</button>
    </div>
  </div>

  <div class="sec">
    <h2>③ 무엇을 할까?</h2>
    <div class="modes">
      <button class="mode m1" data-mode="learn"><div class="ic">📖</div><div class="t">단어 익히기</div><div class="d">카드 넘기며 보고 듣기</div></button>
      <button class="mode m2" data-mode="choose"><div class="ic">👂</div><div class="t">뜻 고르기</div><div class="d">쉬움 · 듣고 뜻 고르기</div></button>
      <button class="mode m3" data-mode="tiles"><div class="ic">🧩</div><div class="t">글자 맞추기</div><div class="d">보통 · 글자 조각 놓기</div></button>
      <button class="mode m4" data-mode="type"><div class="ic">✏️</div><div class="t">직접 쓰기</div><div class="d">도전 · 스펠링 쓰기</div></button>
    </div>
  </div>
</div>

<!-- GAME -->
<div class="screen" id="sGame">
  <div class="top">
    <button class="home" id="homeBtn">🏠</button>
    <div class="bar"><i id="prog"></i></div>
    <div class="stat" id="count">1/10</div>
    <div class="stat">⭐<span id="score">0</span></div>
  </div>
  <div class="combo" id="combo"></div>
  <div id="stage"></div>
</div>

<!-- RESULT -->
<div class="screen" id="sResult">
  <div class="card">
    <div class="rtitle" id="rTitle"></div>
    <div class="stars" id="rStars"></div>
    <div class="big" id="rScore"></div>
    <div id="rWrong"></div>
    <div class="col">
      <button class="btn main" id="rRetryWrong">❗ 틀린 것만 다시</button>
      <button class="btn main" id="rAgain" style="background:var(--blue)">🔁 한 번 더</button>
      <button class="btn sub" id="rHome">🏠 처음으로</button>
    </div>
  </div>
</div>

// ---------- data ----------
const ALL=[];
UNITS.forEach((u,ui)=>u.words.forEach(w=>ALL.push({u:ui+1,title:u.title,en:w[0],def:w[1],ko:w[2],read:w[3],key:w[4]})));

// ---------- sound ----------
const player=new Audio();
function speak(item){
  try{player.pause();player.src=AUDIO[item.key];player.currentTime=0;const r=player.play();if(r&&r.catch)r.catch(()=>{});}catch(e){}
}
let ctx=null;
function beep(good){
  try{
    if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();
    const notes=good?[660,880,1175]:[260,200];
    notes.forEach((f,k)=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type=good?'triangle':'sine';o.frequency.value=f;
      const t=ctx.currentTime+k*0.09;
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.18,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.22);
      o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+0.25);
    });
  }catch(e){}
}

// ---------- helpers ----------
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]];}return a;}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$(id).classList.add('on');window.scrollTo(0,0);}
const PRAISE=['정답! 🎉','최고야! 👏','잘했어! 🌟','완벽해! 💯','멋져! 😎','천재다! 🧠'];
const CHEER=['괜찮아, 다시! 💪','아깝다! 한 번 더 ✏️','조금만 더! 🙂'];
const pick=a=>a[Math.floor(Math.random()*a.length)];
function burst(el){
  const r=el.getBoundingClientRect();const em=['⭐','✨','🎉','💖','🌟'];
  for(let k=0;k<8;k++){
    const s=document.createElement('div');s.className='burst';s.textContent=pick(em);
    s.style.left=(r.left+r.width/2-17)+'px';s.style.top=(r.top+r.height/2-17)+'px';
    const a=Math.random()*Math.PI*2,d=90+Math.random()*80;
    s.style.setProperty('--x',Math.cos(a)*d+'px');s.style.setProperty('--y',Math.sin(a)*d+'px');
    document.body.appendChild(s);setTimeout(()=>s.remove(),1000);
  }
}
const letters=s=>s.toLowerCase().replace(/[^a-z]/g,'');

// ---------- home ----------
let selUnits=new Set([1]), order='seq';
function drawUnits(){
  $('units').innerHTML=UNITS.map((u,i)=>`<button class="unit ${selUnits.has(i+1)?'sel':''}" data-u="${i+1}"><b>Unit ${String(i+1).padStart(2,'0')}</b>${esc(u.title)}</button>`).join('');
  const n=ALL.filter(x=>selUnits.has(x.u)).length;
  $('cnt').textContent=`단어 ${n}개`;
  $('allBtn').textContent=selUnits.size===UNITS.length?'전체 해제':'전체 선택';
}
$('units').onclick=e=>{const b=e.target.closest('.unit');if(!b)return;const u=+b.dataset.u;selUnits.has(u)?selUnits.delete(u):selUnits.add(u);drawUnits();};
$('allBtn').onclick=()=>{selUnits=selUnits.size===UNITS.length?new Set():new Set(UNITS.map((_,i)=>i+1));drawUnits();};
document.querySelectorAll('.toggle').forEach(b=>b.onclick=()=>{document.querySelectorAll('.toggle').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');order=b.dataset.ord;});
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{
  const list=ALL.filter(x=>selUnits.has(x.u));
  if(!list.length){$('cnt').textContent='공부할 Unit을 먼저 골라 주세요 👆';$('cnt').style.color='var(--red)';setTimeout(()=>{$('cnt').style.color='';drawUnits();},1500);return;}
  start(b.dataset.mode,list);
});
drawUnits();

// ---------- game state ----------
let mode,base,deck,idx,score,combo,wrong,tries,locked;
function start(m,list){
  mode=m;base=list;deck=order==='rand'?shuffle(list):list.slice();
  idx=0;score=0;combo=0;wrong=[];
  $('score').parentElement.style.visibility=mode==='learn'?'hidden':'visible';
  show('sGame');render();
}
$('homeBtn').onclick=()=>{player.pause();show('sHome');};

function header(){
  $('count').textContent=`${idx+1}/${deck.length}`;
  $('prog').style.width=(idx/deck.length*100)+'%';
  $('score').textContent=score;
  $('combo').textContent=combo>=2?`🔥 ${combo} 콤보!`:'';
}
function setCombo(ok){
  if(ok){combo++;if(combo>=2){$('combo').classList.add('pop');setTimeout(()=>$('combo').classList.remove('pop'),200);}}
  else combo=0;
  $('combo').textContent=combo>=2?`🔥 ${combo} 콤보!`:'';
  $('score').textContent=score;
}
function markWrong(it){if(!wrong.includes(it))wrong.push(it);}
function next(){idx++;if(idx<deck.length)render();else finish();}

function render(){
  tries=0;locked=false;header();
  const it=deck[idx];
  ({learn:rLearn,choose:rChoose,tiles:rTiles,type:rType})[mode](it);
}

// ---------- learn ----------
function rLearn(it){
  $('stage').innerHTML=`
  <div class="card">
    <div class="utag">Unit ${it.u} · ${esc(it.title)}</div>
    <div class="word en">${esc(it.en)}</div>
    <div class="read">[${esc(it.read)}]</div>
    <button class="say" id="say">🔊</button>
    <div class="ko" style="margin-top:14px">${esc(it.ko)}</div>
    <div class="def">${esc(it.def)}</div>
  </div>
  <div class="nav">
    <button class="btn sub" id="prev" ${idx===0?'disabled':''}>◀ 이전</button>
    <button class="btn main" id="nx">${idx<deck.length-1?'다음 ▶':'다 봤어요! ✅'}</button>
  </div>`;
  $('say').onclick=()=>speak(it);
  $('prev').onclick=()=>{if(idx>0){idx--;render();}};
  $('nx').onclick=()=>{if(idx<deck.length-1){idx++;render();}else learnDone();};
  speak(it);
}
function learnDone(){
  $('prog').style.width='100%';
  $('stage').innerHTML=`
  <div class="card">
    <div style="font-size:60px">🎉</div>
    <div class="rtitle">단어 ${deck.length}개 다 봤어요!</div>
    <div style="font-size:19px;color:#9a8679;margin:10px 0 20px">이제 문제로 확인해 볼까요?</div>
    <div class="col">
      <button class="btn main" style="background:var(--green)" data-go="choose">👂 뜻 고르기</button>
      <button class="btn main" style="background:#f39c3d" data-go="tiles">🧩 글자 맞추기</button>
      <button class="btn main" style="background:var(--purple)" data-go="type">✏️ 직접 쓰기</button>
      <button class="btn sub" data-go="home">🏠 처음으로</button>
    </div>
  </div>`;
  $('stage').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{b.dataset.go==='home'?show('sHome'):start(b.dataset.go,base);});
}

// ---------- choose ----------
function rChoose(it){
  const others=shuffle(ALL.filter(x=>x.ko!==it.ko)).slice(0,3);
  const opts=shuffle([it,...others]);
  $('stage').innerHTML=`
  <div class="card">
    <div class="utag">Unit ${it.u}</div>
    <div class="word en">${esc(it.en)}</div>
    <button class="say small" id="say">🔊</button>
    <div style="font-size:19px;color:#9a8679;margin-top:8px">무슨 뜻일까?</div>
  </div>
  <div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o.ko)}</button>`).join('')}</div>
  <div class="msg" id="msg" style="text-align:center"></div>
  <div class="nav" id="nav" style="display:none"><button class="btn main" id="nx">${idx<deck.length-1?'다음 ▶':'결과 보기 🏁'}</button></div>`;
  $('say').onclick=()=>speak(it);
  $('stage').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(locked)return;
    const o=opts[+b.dataset.k];
    if(o===it){
      locked=true;b.classList.add('ok');
      if(tries===0)score++;else markWrong(it);
      setCombo(tries===0);beep(true);burst(b);
      $('msg').textContent=pick(PRAISE);
      $('nav').style.display='flex';$('nx').onclick=next;
    }else{
      tries++;b.classList.add('no');b.disabled=true;markWrong(it);setCombo(false);beep(false);
      $('msg').textContent=pick(CHEER);
      if(tries>=2){
        locked=true;
        $('stage').querySelectorAll('.opt').forEach(x=>{if(opts[+x.dataset.k]===it)x.classList.add('ok');});
        $('msg').innerHTML='정답은 초록색이에요 👀';
        $('nav').style.display='flex';$('nx').onclick=next;
      }
    }
  });
  speak(it);
}

// ---------- tiles ----------
let filled,tileLetters;
function rTiles(it){
  const target=letters(it.en);
  tileLetters=shuffle(target.split('').map((c,k)=>({c,k})));
  if(target.length>1 && tileLetters.map(t=>t.c).join('')===target) tileLetters.reverse();
  filled=[];
  $('stage').innerHTML=`
  <div class="card">
    <div class="utag">Unit ${it.u}</div>
    <div class="ko">${esc(it.ko)}</div>
    <div class="def">${esc(it.def)}</div>
    <button class="say small" id="say" style="margin-top:12px">🔊</button>
    <div class="slots" id="slots"></div>
    <div class="tiles" id="tiles"></div>
    <div class="msg" id="msg"></div>
    <div class="nav" id="nav" style="display:none"><button class="btn main" id="nx">${idx<deck.length-1?'다음 ▶':'결과 보기 🏁'}</button></div>
  </div>`;
  $('say').onclick=()=>speak(it);
  drawTiles(it);
}
function drawTiles(it,state){
  // slots grouped by word; hyphen shown as fixed char
  let n=0;
  const parts=it.en.split(' ');
  $('slots').innerHTML=parts.map(p=>'<div class="grp">'+p.split('').map(ch=>{
    if(!/[a-zA-Z]/.test(ch))return `<div class="slot fix en">${esc(ch)}</div>`;
    const t=filled[n];const h=`<div class="slot en ${t!=null?'f':''}" data-n="${n}">${t!=null?tileLetters[t].c:''}</div>`;n++;return h;
  }).join('')+'</div>').join('');
  if(state)$('slots').classList.add(state);
  $('tiles').innerHTML=tileLetters.map((t,k)=>`<button class="tile en ${filled.includes(k)?'used':''}" data-k="${k}">${t.c}</button>`).join('');
  $('tiles').querySelectorAll('.tile').forEach(b=>b.onclick=()=>{
    if(locked)return;const k=+b.dataset.k;
    const pos=filled.findIndex(x=>x==null);
    if(pos>=0)filled[pos]=k;else filled.push(k);
    drawTiles(it);
    if(filled.filter(x=>x!=null).length===letters(it.en).length)checkTiles(it);
  });
  $('slots').querySelectorAll('.slot[data-n]').forEach(s=>s.onclick=()=>{
    if(locked)return;const n2=+s.dataset.n;
    if(filled[n2]!=null){filled[n2]=null;drawTiles(it);}
  });
}
function checkTiles(it){
  const got=filled.map(k=>tileLetters[k].c).join('');
  if(got===letters(it.en)){
    locked=true;
    if(tries===0)score++;else markWrong(it);
    setCombo(tries===0);beep(true);
    drawTiles(it,'ok');burst($('slots'));speak(it);
    $('msg').textContent=pick(PRAISE);
    $('tiles').style.display='none';
    $('nav').style.display='flex';$('nx').onclick=next;
  }else{
    tries++;markWrong(it);setCombo(false);beep(false);
    drawTiles(it,'no');$('slots').classList.add('shake');
    if(tries>=2){
      locked=true;
      $('msg').innerHTML=`정답은 <span class="ans">${esc(it.en)}</span>`;speak(it);
      $('tiles').style.display='none';
      $('nav').style.display='flex';$('nx').onclick=next;
    }else{
      $('msg').textContent=pick(CHEER);
      setTimeout(()=>{filled=[];$('slots').className='slots';drawTiles(it);},900);
    }
  }
}

// ---------- type ----------
let hint;
function rType(it){
  hint=0;
  $('stage').innerHTML=`
  <div class="card">
    <div class="utag">Unit ${it.u}</div>
    <div class="ko">${esc(it.ko)}</div>
    <div class="def">${esc(it.def)}</div>
    <button class="say small" id="say" style="margin-top:12px">🔊</button>
    <div class="blanks en" id="blanks"></div>
    <form id="f" autocomplete="off">
      <input class="typ" id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="영어로 써 보세요">
      <div class="msg" id="msg"></div>
      <div class="nav">
        <button type="button" class="btn sub" id="hintBtn">💡 힌트</button>
        <button type="submit" class="btn main" id="go">확인</button>
      </div>
    </form>
  </div>`;
  drawBlanks(it);
  $('say').onclick=()=>speak(it);
  $('hintBtn').onclick=()=>{if(locked)return;if(hint<letters(it.en).length-1){hint++;drawBlanks(it);}};
  $('f').onsubmit=e=>{
    e.preventDefault();
    if(locked){next();return;}
    const a=$('ans'),v=letters(a.value);if(!v)return;
    if(v===letters(it.en)){
      locked=true;a.className='typ ok';a.disabled=true;
      if(tries===0&&hint===0)score++;else markWrong(it);
      setCombo(tries===0&&hint===0);beep(true);burst(a);speak(it);
      $('msg').innerHTML=pick(PRAISE)+`<br><span class="ans">${esc(it.en)}</span>`;
      endType();
    }else{
      tries++;markWrong(it);setCombo(false);beep(false);
      a.className='typ no';a.classList.add('shake');setTimeout(()=>a.classList.remove('shake'),400);
      if(tries>=2){
        locked=true;a.disabled=true;speak(it);
        $('msg').innerHTML=`정답은 <span class="ans">${esc(it.en)}</span>`;endType();
      }else{$('msg').textContent=pick(CHEER)+' (힌트도 써 봐요)';a.select();}
    }
  };
}
function drawBlanks(it){
  let n=0;
  $('blanks').textContent=it.en.split('').map(ch=>{
    if(ch===' ')return '  ';
    if(!/[a-zA-Z]/.test(ch))return ch;
    const r=n<hint?ch:'_';n++;return r;
  }).join(' ')+`   (${letters(it.en).length}글자)`;
}
function endType(){
  $('hintBtn').disabled=true;
  $('go').textContent=idx<deck.length-1?'다음 ▶':'결과 보기 🏁';
}

// ---------- result ----------
function finish(){
  player.pause();
  const n=deck.length,r=score/n;
  $('rTitle').textContent=r===1?'완벽해요! 💯':r>=0.8?'아주 잘했어요! 🎉':r>=0.5?'좋아요, 조금만 더! 💪':'천천히 다시 해 봐요 🙂';
  $('rStars').textContent=r>=0.9?'⭐⭐⭐':r>=0.6?'⭐⭐☆':r>=0.3?'⭐☆☆':'☆☆☆';
  $('rScore').textContent=`${score} / ${n}`;
  if(wrong.length){
    $('rWrong').innerHTML=`<div style="font-size:20px;margin-top:10px">다시 볼 단어 ${wrong.length}개</div><div class="wl">`+
      wrong.map((x,k)=>`<div><button data-k="${k}">🔊</button><span class="w">${esc(x.en)}</span><span class="k">${esc(x.ko)}</span></div>`).join('')+'</div>';
    $('rWrong').querySelectorAll('button').forEach(b=>b.onclick=()=>speak(wrong[+b.dataset.k]));
    $('rRetryWrong').style.display='';
  }else{$('rWrong').innerHTML='';$('rRetryWrong').style.display='none';}
  show('sResult');
}
$('rRetryWrong').onclick=()=>start(mode,wrong.slice());
$('rAgain').onclick=()=>start(mode,base);
$('rHome').onclick=()=>show('sHome');
</script>
</body>
</html>
